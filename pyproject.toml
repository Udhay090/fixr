[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixr-cli"
version = "0.2.1"
description = "AI-powered CLI that explains programming errors using a persistent cache and LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
fxr = "fixr.main:cli"
fixr = "fixr.main:cli"

[project.urls]
Homepage = "https://github.com/Udhay090/fixr"

[tool.hatch.build.targets.wheel]
packages = ["fixr"]
